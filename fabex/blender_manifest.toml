    "./wheels/llvmlite-0.47.0-cp313-cp313-win_amd64.whl",

    # numba 
    "./wheels/numba-0.65.1-cp313-cp313-macosx_12_0_arm64.whl",
    "./wheels/numba-0.65.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
    "./wheels/numba-0.65.1-cp313-cp313-win_amd64.whl",

    # opencamlib: sourced from https://github.com/SpectralVectors/opencamlib/releases/tag/Python313_Wheels
    "./wheels/opencamlib-2026.3.3.dev27-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
    "./wheels/opencamlib-2026.3.3.dev27-cp313-cp313-win_amd64.whl",
    "./wheels/opencamlib-2026.3.5.dev92-cp313-cp313-macosx_15_0_arm64.whl",

